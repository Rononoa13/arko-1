<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Counter</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <main id="app">

        <h1>अर्को १</h1>
        <section id="drink-counts"></section>
        <section id="drink-actions">
            <button
                id="add-beer"
                class="drink-button"
                type="button"
                aria-label="Add beer"
            >
                🍻
            </button>
        </section>

        <section id="session-actions">
            <button id="reset-session">Reset session</button>
        </section>

    </main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
