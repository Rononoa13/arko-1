<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Beer Counter</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <main id="app">
        <section id="install-ios" class="install-prompt" hidden>
            <div class="install-prompt-content">
                <strong>Add Arko 1 to your Home Screen</strong>

                <p>
                    Tap
                    <span class="share-icon">↑</span>
                    <strong>Share</strong>
                    and choose
                    <strong>Add to Home Screen</strong>.
                </p>

                <button id="dismiss-ios-install" type="button">
                    Not now
                </button>
            </div>
        </section>

        <h1>अर्को १</h1>
        <section id="drink-counts"></section>
        <section id="drink-actions">
            <button
                id="add-beer"
                class="drink-button"
                type="button"
                aria-label="Add beer"
            >
                🍻
            </button>
        </section>

        <section id="session-actions">
            <button id="reset-session">Reset session</button>
        </section>

    </main>

    <script type="module" src="/js/app.js"></script>
    
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service-worker.js");
        }
    </script>
</body>
</html>
